<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'" />
  <title>XIV Fleet Companion</title>
  <link rel="stylesheet" href="../node_modules/uplot/dist/uPlot.min.css" />
  <style>
    body {
      margin: 0;
      font-family: -apple-system, Segoe UI, Roboto, sans-serif;
      background: #12141a;
      color: #e6e6e6;
    }
    h1 {
      padding: 20px 24px 8px;
      margin: 0;
      font-size: 20px;
    }
    .subtitle {
      padding: 0 24px 16px;
      color: #8a8f9a;
      font-size: 13px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    th, td {
      text-align: left;
      padding: 8px 24px;
      border-bottom: 1px solid #23262e;
      font-size: 13px;
    }
    th {
      color: #8a8f9a;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.04em;
    }
    tr:hover td {
      background: #1a1d24;
    }
    .status {
      padding: 24px;
      color: #8a8f9a;
    }
    .account-group {
      margin-bottom: 8px;
    }
    .account-group h2 {
      padding: 16px 24px 8px;
      margin: 0;
      font-size: 15px;
      border-top: 2px solid #2a2e38;
    }
    .account-group .count {
      color: #8a8f9a;
      font-weight: 400;
      font-size: 13px;
    }
    .controls {
      padding: 0 24px 12px;
      font-size: 13px;
      color: #c0c4cc;
    }
    .drag-handle {
      display: inline-block;
      cursor: grab;
      color: #565b66;
      width: 18px;
      text-align: center;
    }
    tr.sortable-ghost {
      opacity: 0.4;
    }
    .error {
      padding: 24px;
      color: #e57373;
      white-space: pre-wrap;
    }

    button {
      background: #1a1d24;
      color: #e6e6e6;
      border: 1px solid #2a2e38;
      border-radius: 4px;
      padding: 8px 14px;
      font-size: 13px;
      cursor: pointer;
    }
    button:hover {
      background: #23262e;
    }
    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    /* Roster's per-row Remove: quiet until hovered; the confirmation wraps inside its cell. */
    /* The start of each roster row: the drag handle and a faint ×, brighter on the row under the mouse. */
    td.row-tools, th.row-tools { width: 48px; min-width: 48px; padding-left: 8px; padding-right: 0; white-space: nowrap; }
    button.remove-character { padding: 0 6px; margin-left: 4px; font-size: 15px; line-height: 18px; color: #8a8f9a; background: transparent; border-color: transparent; opacity: 0.35; }
    tr:hover button.remove-character, button.remove-character:focus-visible { opacity: 1; }
    button.remove-character:hover { color: #e57373; border-color: #e57373; }
    .modal.remove-confirm { max-width: 460px; }
    .modal.remove-confirm p { margin: 0 0 10px; color: #c4c8d0; line-height: 1.5; }
    .modal.remove-confirm button.danger, .modal.backups-confirm button.danger { color: #e57373; border-color: #e57373; }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal {
      background: #181b21;
      border: 1px solid #2a2e38;
      border-radius: 6px;
      padding: 24px;
      width: 90%;
      max-width: 800px;
      max-height: 85vh;
      overflow-y: auto;
    }
    .modal h2 {
      margin: 0 0 16px;
      font-size: 17px;
    }
    .modal input[type="text"] {
      background: #12141a;
      color: #e6e6e6;
      border: 1px solid #2a2e38;
      border-radius: 4px;
      padding: 6px 10px;
      font-size: 13px;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #23262e;
    }
    .warning {
      background: rgba(224, 185, 106, 0.1);
      border: 1px solid rgba(224, 185, 106, 0.3);
      color: #e0b96a;
      padding: 10px 14px;
      border-radius: 4px;
      font-size: 13px;
      margin-bottom: 12px;
    }
    .preview-table {
      margin-top: 12px;
      font-size: 12px;
    }
    .preview-table th, .preview-table td {
      padding: 6px 10px;
    }
    tr.flagged-row td {
      background: rgba(224, 185, 106, 0.08);
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding-right: 24px;
    }
    .gear-button {
      font-size: 18px;
      padding: 6px 10px;
      margin-top: 16px;
    }

    .settings-modal {
      max-width: 680px;
      /* A fixed size, so switching tabs does not make the window jump; each tab scrolls inside. */
      height: min(760px, 85vh);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .settings-header {
      display: flex;
      align-items: baseline;
      gap: 12px;
    }
    .settings-header h2 {
      margin-bottom: 12px;
    }
    .settings-tabs {
      display: flex;
      gap: 4px;
      border-bottom: 1px solid #2a2e38;
      margin-bottom: 16px;
    }
    .settings-tab {
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      border-radius: 0;
      color: #8a8f9a;
      padding: 8px 14px;
      margin-bottom: -1px;
    }
    .settings-tab:hover {
      color: #e6e6e6;
    }
    .settings-tab.active {
      color: #e6e6e6;
      border-bottom-color: #5b8def;
    }
    .settings-tab-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-left: 6px;
      border-radius: 50%;
      background: #e0b96a;
      vertical-align: middle;
    }
    .settings-body {
      flex: 1;
      overflow-y: auto;
      padding-right: 6px;
    }
    .settings-section {
      border-top: 1px solid #23262e;
      padding-top: 16px;
      margin-top: 16px;
    }
    .settings-section:first-of-type {
      border-top: none;
      padding-top: 0;
      margin-top: 0;
    }
    .settings-section h3 {
      margin: 0 0 12px;
      font-size: 14px;
      color: #c0c4cc;
    }
    .settings-row {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 10px;
      font-size: 13px;
    }
    .settings-row label {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .settings-row input[type="text"],
    .settings-row input[type="password"],
    .settings-row input[type="number"] {
      background: #12141a;
      color: #e6e6e6;
      border: 1px solid #2a2e38;
      border-radius: 4px;
      padding: 5px 8px;
      font-size: 13px;
    }
    .save-status {
      color: #8a8f9a;
      font-size: 12px;
    }
    .summary-thresholds {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      color: #8a8f9a;
      font-size: 13px;
    }
    /* Settings: Discord alerts */
    .alerts-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .alerts-attention {
      margin: 6px 0 10px;
      color: #e0b96a;
      font-size: 13px;
    }
    .alerts-help-button {
      font-size: 12px;
      padding: 3px 10px;
      font-weight: 400;
    }
    .modal.alerts-setup-help {
      max-width: 640px;
      font-size: 13px;
      line-height: 1.55;
      color: #c4c8d0;
    }
    .alerts-setup-help h3 {
      margin: 18px 0 6px;
      font-size: 14px;
      color: #e6e6e6;
    }
    .alerts-setup-help ol,
    .alerts-setup-help ul {
      padding-left: 22px;
      margin: 8px 0;
    }
    .alerts-setup-help li {
      margin-bottom: 8px;
    }
    .alerts-setup-help strong {
      color: #e6e6e6;
    }
    .alerts-section h4 {
      margin: 14px 0 8px;
      font-size: 13px;
      color: #a8adb7;
    }
    .alerts-section .settings-row {
      flex-wrap: wrap;
      gap: 10px 16px;
    }
    .alerts-help {
      margin: -4px 0 10px;
      color: #8a8f9a;
      font-size: 12px;
      line-height: 1.5;
    }
    .alerts-section input[type="time"] {
      background: #12141a;
      color: #e6e6e6;
      border: 1px solid #2a2e38;
      border-radius: 4px;
      padding: 4px 6px;
      font-size: 13px;
      color-scheme: dark;
    }
    .alerts-actions {
      margin-top: 14px;
    }
    .plugin-data {
      cursor: help;
    }
    .plugin-data.stale {
      color: #e0b96a;
    }
    /* Database connection: a dot in the header, and a banner while it cannot be reached. */
    .connection-dot {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      cursor: help;
    }
    .connection-dot::before {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #6fbf82;
    }
    .connection-dot.offline {
      color: #e0b96a;
    }
    .connection-dot.offline::before {
      background: #e0b96a;
    }
    .connection-banner {
      margin: 0 0 16px;
      padding: 10px 14px;
      border: 1px solid #e0b96a;
      border-radius: 6px;
      color: #e8d3a5;
      background: rgba(224, 185, 106, 0.08);
      font-size: 13px;
      line-height: 1.5;
    }
    .update-banner {
      margin: 0 0 16px;
      padding: 10px 14px;
      border: 1px solid #5b8def;
      border-radius: 6px;
      color: #c9d8f7;
      background: rgba(91, 141, 239, 0.08);
      font-size: 13px;
      line-height: 1.5;
    }
    .update-banner button { margin: 0 4px; }
    /* Settings > Backups */
    .backups-folder, .backups-copy-folder, .backups-pgbin { width: 260px; }
    .backups-keep { width: 60px; }
    .backups-last { margin: 8px 0 12px; font-size: 13px; }
    .backups-list { border-collapse: collapse; margin: 6px 0; font-size: 13px; }
    .backups-list th, .backups-list td { padding: 3px 12px 3px 0; text-align: left; }
    .backups-list td button { margin-right: 6px; }
    .backups-log pre { max-height: 200px; overflow: auto; font-size: 12px; white-space: pre-wrap; }
    .backups-section h4 { margin: 16px 0 4px; }
    /* Settings: Setup Help */
    .setup-pages { display: flex; gap: 6px; margin-bottom: 14px; }
    .setup-page { font-size: 12px; padding: 4px 12px; font-weight: 400; }
    .setup-page.active { background: #2a3550; border-color: #4a6aa8; color: #e6e6e6; }
    .setup-help { font-size: 13px; line-height: 1.55; color: #c4c8d0; }
    .setup-help p { margin: 0 0 10px; }
    .setup-help h4 { margin: 16px 0 6px; font-size: 13px; color: #e6e6e6; }
    .setup-help ol { padding-left: 22px; margin: 6px 0; }
    .setup-help li { margin-bottom: 6px; }
    .setup-help strong { color: #e6e6e6; }
    .setup-line { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
    .setup-line code { background: #12141a; border: 1px solid #2a2e38; border-radius: 4px; padding: 4px 8px; user-select: all; word-break: break-all; }
    .setup-copy { font-size: 12px; padding: 3px 10px; font-weight: 400; flex: none; }
    .setup-details, .setup-plugins { border-collapse: collapse; margin: 6px 0 10px; }
    .setup-details th, .setup-plugins th { text-align: left; padding: 4px 16px 4px 0; color: #a8adb7; font-weight: 600; vertical-align: top; }
    .setup-details td, .setup-plugins td { padding: 4px 16px 4px 0; vertical-align: top; }
    .setup-repo-name { margin-top: 6px; color: #a8adb7; }
    .credits-list { margin: 4px 0 8px; padding-left: 22px; }
    .speed-findings { margin: 8px 0; padding-left: 22px; }
    .speed-findings li { margin: 3px 0; }
    .speed-findings li.speed-slow { color: #e0b96a; }
    .speed-findings li.speed-ok { color: #8a8f9a; }
    .speed-tabs { border-collapse: collapse; margin-top: 6px; }
    .speed-tabs th, .speed-tabs td { padding: 2px 14px 2px 0; text-align: left; }
    .speed-tabs td:last-child { font-variant-numeric: tabular-nums; }
    .speed-detail { margin: 4px 0 8px; padding-left: 22px; }
    .speed-detail code { font-size: 0.85em; color: #8a8f9a; }
    .setup-thanks { margin-top: 10px; color: #c9ccd3; }
    .setup-details select { background: #12141a; color: #e6e6e6; border: 1px solid #2a2e38; border-radius: 4px; padding: 4px 6px; }
    .setup-test-address { width: 200px; }
    .setup-test-status { margin: 4px 0 10px; color: #e6e6e6; }
    .setup-open { margin-top: 18px; border-top: 1px solid #2a2e38; padding-top: 6px; }
    .setup-open-check { margin: 4px 0 8px; color: #e6e6e6; }
    .setup-remove { margin-top: 24px; border-top: 1px solid #2a2e38; padding-top: 6px; }
    .setup-remove .remove-list, .setup-remove .keep-list { margin: 4px 0 10px; padding-left: 22px; }
    .setup-remove .remove-tailscale { display: block; margin-bottom: 10px; }
    .setup-remove button.danger { background: #8e2b2b; color: #fff; }
    .setup-remove button.danger:disabled { opacity: 0.5; }
    .setup-run { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .modal.setup-wizard { max-width: 680px; font-size: 13px; line-height: 1.55; color: #c4c8d0; }
    .setup-wizard h2 { margin-top: 0; }
    .setup-wizard h4 { margin: 14px 0 4px; color: #e6e6e6; }
    .setup-wizard strong { color: #e6e6e6; }
    .setup-roles { display: flex; flex-direction: column; gap: 8px; margin: 8px 0 12px; }
    .setup-role { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border: 1px solid #2a2e38; border-radius: 6px; cursor: pointer; }
    .setup-role.active { border-color: #4a6aa8; background: #1a2232; }
    .setup-same-network { display: block; margin: 4px 0 10px; }
    .setup-plan, .setup-steps-list { padding-left: 22px; margin: 6px 0 10px; }
    .setup-steps-list { list-style: none; padding-left: 0; }
    .setup-step { margin-bottom: 6px; }
    .setup-step-mark { display: inline-block; width: 18px; }
    .setup-step.done .setup-step-mark { color: #6fbf73; }
    .setup-step.failed .setup-step-mark, .setup-problem { color: #e57373; }
    .setup-step.working .setup-step-mark { color: #e0b96a; }
    .setup-names { margin: 10px 0; }
    .setup-ts-status { margin: 8px 0; color: #e6e6e6; }
    /* Supplies */
    .supplies-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 18px; }
    .supplies-summary { display: flex; flex-wrap: wrap; gap: 12px; padding: 0 24px 12px; }
    .supply-card { flex: 1 1 0; min-width: 200px; box-sizing: border-box; padding: 14px 16px; }
    .supply-card-label { color: #8a8f9a; font-size: 13px; }
    .supply-card-value { font-size: 17px; font-weight: 600; margin-top: 4px; }
    .supply-card-note { color: #8a8f9a; font-size: 12px; margin-top: 4px; }
    .not-synced-tag { white-space: nowrap; margin-left: 8px; padding: 1px 6px; border-radius: 3px; font-size: 11px; color: #e0b96a; border: 1px solid rgba(224, 185, 106, 0.4); cursor: help; }
    .not-synced-note { margin: 12px 24px; }
    .unseen-retainers { margin: 8px 24px 12px; }
    .unseen-retainers summary { cursor: pointer; }
    .unseen-retainers ul { margin: 8px 0 4px; padding-left: 20px; max-height: 200px; overflow-y: auto; }
    .unseen-retainers-note { color: #8a8f9a; font-size: 12px; }
    .supplies-note { color: #8a8f9a; font-size: 12px; padding: 0 24px 8px; }
    .supplies-note-inline { color: #8a8f9a; font-size: 12px; }
    .fc-credits { margin-top: 16px; }
    .fc-credits table { margin-bottom: 12px; }
    .pcs-check { margin: 12px 24px; padding: 8px 12px; }
    .pcs-check summary { cursor: pointer; }
    .pcs-check pre { white-space: pre-wrap; font-size: 12px; margin: 8px 0 0; }
    .pcs-problems ul { margin: 4px 0; padding-left: 18px; }
    .pcs-problems summary { cursor: pointer; }
    .pcs-unreported { margin: 12px 24px; }
    .table-menu { position: fixed; z-index: 1000; background: #23262d; border: 1px solid #3a3f4a; border-radius: 6px; padding: 4px; display: flex; flex-direction: column; box-shadow: 0 4px 16px rgba(0,0,0,0.4); }
    .table-menu button { text-align: left; background: none; border: none; color: inherit; padding: 6px 12px; cursor: pointer; }
    .table-menu button:hover { background: #2f3440; }
    .table-menu-note { position: fixed; bottom: 16px; right: 16px; z-index: 1000; background: #23262d; border: 1px solid #3a3f4a; border-radius: 6px; padding: 8px 12px; font-size: 13px; }
    .supplies > .status { padding: 0 24px; }
    .supplies-table th.supply-group { text-align: center; border-bottom: 1px solid #2c3039; }
    .supplies-table td:first-child, .supplies-table td:nth-child(2) { white-space: nowrap; }
    .supplies-table td.supply-warn { color: #e0b96a; }
    .supplies-table td.supply-danger { color: #e57373; font-weight: 600; }
    .pcs-table td.supply-warn { color: #e0b96a; }
    .pcs-table td.supply-danger { color: #e57373; font-weight: 600; }
    .pcs-update-plugin { margin: 8px 0 12px; padding: 10px 14px; border: 1px solid #e57373; border-radius: 6px; color: #f0c4c4; background: rgba(229, 115, 115, 0.08); font-size: 13px; line-height: 1.5; }

    .subs-dim { color: #8a8f9a; }

    /* Income */
    .income-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 18px; }
    .income > .status { padding: 0 24px; }
    .income-table td { white-space: nowrap; }
    .income-table td.income-real { font-weight: 600; }
    .income-table td.income-none { color: #8a8f9a; }
    .income-table td.income-warn { color: #e0b96a; }
    .income-table td.income-danger { color: #e57373; font-weight: 600; }
    .error-inline { color: #e57373; font-size: 12px; }
    /* Inventory → Where Is It? */
    .where-note { color: #8a8f9a; font-size: 12px; padding: 0 24px 8px; }
    .where-item { margin: 10px 0 20px; }
    .where-item h3 { margin: 0 0 6px; padding: 0 24px; font-size: 15px; color: #e6e6e6; }
    .where-total { margin-left: 8px; color: #8a8f9a; font-size: 13px; font-weight: normal; }
    .where-is-it > .status, .where-is-it > .error { padding-left: 24px; padding-right: 24px; }
    .status-inline { color: #8a8f9a; font-size: 12px; }
    .where-item tr.where-account td { padding-top: 12px; font-weight: 600; color: #c0c4cc; font-size: 13px; }
    /* Parts → Shopping List */
    .shopping-section { margin: 14px 0 22px; }
    .shopping-section h3 { margin: 0 0 6px; padding: 0 24px; font-size: 15px; color: #e6e6e6; }
    .shopping-note { color: #8a8f9a; font-size: 12px; margin: 2px 0 6px; padding: 0 24px; }
    .shopping-list > .error, .shopping-section > .status { padding-left: 24px; padding-right: 24px; }
    .shopping-section td .shopping-note { padding: 0; }
    .shopping-section tr.shopping-done td { color: #8a8f9a; }
    .shopping-places { color: #c0c4cc; font-size: 12px; }
    .shopping-total { margin-left: 10px; color: #e0b96a; font-size: 14px; }
    button.link-button { padding: 0; background: transparent; border: none; color: #7aa7e0; cursor: pointer; font-size: 12px; text-decoration: underline; }
    /* How long since an FC house was last entered (Free Companies tab and Summary). */
    .house-age.warn {
      color: #e0b96a;
    }
    .house-age.danger,
    .house-age.unknown {
      color: #e57373;
      font-weight: 600;
    }

    .app-shell {
      display: flex;
      height: 100vh;
    }
    .sidebar {
      width: 180px;
      flex-shrink: 0;
      background: #0d0f13;
      border-right: 1px solid #23262e;
      padding: 16px 0;
      overflow-y: auto;
    }
    .sidebar-button {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      border-radius: 0;
      border-left: 3px solid transparent;
      padding: 10px 20px;
      font-size: 13px;
      color: #c0c4cc;
    }
    .sidebar-button:hover {
      background: #1a1d24;
    }
    .sidebar-button.active {
      background: #1a1d24;
      border-left-color: #5b8def;
      color: #e6e6e6;
    }
    .coming-soon-tag {
      font-size: 10px;
      color: #565b66;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-top: 2px;
    }
    .column-chooser-wrap { position: relative; display: inline-block; }
    .column-chooser {
      position: absolute; z-index: 30; top: 100%; left: 0; margin-top: 4px; min-width: 300px; max-height: 80vh; overflow-y: auto;
      background: #1a1d24; border: 1px solid #3a3f4a; border-radius: 6px; padding: 10px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
    }
    .column-chooser-title { font-weight: 600; color: #c8ccd4; margin: 2px 0 4px; }
    .column-chooser-group { color: #8a8f9a; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; margin: 8px 0 2px; }
    .column-chooser-add { max-height: 260px; overflow-y: auto; }
    .column-chooser-search { width: 100%; box-sizing: border-box; margin: 2px 0 6px; }
    .column-chooser-row { display: flex; justify-content: space-between; align-items: center; padding: 2px 0; }
    .column-chooser-row button { padding: 0 6px; margin-left: 2px; }
    .main-pane {
      flex: 1;
      overflow-y: auto;
      overflow-x: auto;
      min-width: 0;
    }

    /* ---- Trends ---- */
    .trend-field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #8a8f9a; }
    .trend-field select, .trend-field input { min-width: 180px; }
    .trend-segmented { display: inline-flex; }
    .trend-segmented button { border-radius: 0; margin-left: -1px; padding: 7px 12px; }
    .trend-segmented button:first-child { border-radius: 4px 0 0 4px; margin-left: 0; }
    .trend-segmented button:last-child { border-radius: 0 4px 4px 0; }
    .trend-segmented button.active { background: #2a3a55; border-color: #3987e5; color: #ffffff; position: relative; }
    .trend-chart-wrap { position: relative; margin-top: 8px; transition: opacity 0.15s; }
    .trend-tip {
      position: absolute; z-index: 5; pointer-events: none; min-width: 190px;
      background: #1a1d24; border: 1px solid #2a2e38; border-radius: 4px; padding: 8px 10px; font-size: 12px;
    }
    .trend-tip-time { color: #8a8f9a; margin-bottom: 6px; }
    .trend-tip-row { display: flex; align-items: center; gap: 8px; margin-top: 3px; }
    .trend-tip-row strong { color: #ffffff; font-size: 13px; }
    .trend-tip-name { color: #8a8f9a; }
    .trend-key { display: inline-block; width: 14px; height: 3px; border-radius: 2px; flex-shrink: 0; }
    .trend-chip {
      display: inline-flex; align-items: center; gap: 6px; background: #1a1d24; border: 1px solid #2a2e38;
      border-radius: 4px; padding: 3px 8px; font-size: 12px;
    }
    .trend-menu {
      position: absolute; top: 100%; left: 0; z-index: 10; background: #1a1d24; border: 1px solid #333;
      max-height: 240px; overflow-y: auto; min-width: 340px;
    }
    .trend-menu-item { padding: 5px 10px; cursor: pointer; font-size: 13px; }
    .trend-menu-item:hover { background: #23262e; }
    .trend-legend { display: flex; flex-wrap: wrap; gap: 6px 22px; margin: 6px 0 4px; font-size: 13px; }
    .trend-legend-item { display: inline-flex; align-items: center; gap: 8px; color: #8a8f9a; }
    .trend-legend-item strong { color: #e6e6e6; font-weight: 600; }
    .trend-summary { display: flex; gap: 40px; margin: 4px 0 6px; }
    .trend-summary-label { color: #8a8f9a; font-size: 12px; }
    .trend-summary-value { font-size: 26px; font-weight: 600; color: #ffffff; }
    .trend-summary-sub { font-size: 14px; font-weight: 400; color: #8a8f9a; }
    .u-select { background: rgba(57, 135, 229, 0.18); }
    .trend-table-box { box-sizing: border-box; overflow: auto; resize: vertical; min-height: 160px; border: 1px solid #23262e; border-radius: 4px; }
    .trend-table-box table { margin: 0; }
    .trend-table-box th { position: sticky; top: 0; z-index: 1; background: #12141a; }
    .trend-note { color: #8a8f9a; font-size: 13px; padding: 4px 0; }
    .trends-root select, .trends-root input[type="text"] {
      background: #1a1d24; color: #e6e6e6; border: 1px solid #2a2e38; border-radius: 4px;
      padding: 7px 8px; font-size: 13px;
    }
    .trends-root select:focus, .trends-root input[type="text"]:focus { outline: 1px solid #3987e5; }
    .trend-link {
      background: none; border: 1px solid transparent; color: #8a8f9a; padding: 1px 4px; margin-left: 6px;
      border-radius: 3px; vertical-align: middle; line-height: 0; cursor: pointer;
    }
    .trend-link:hover { color: #3987e5; border-color: #2a2e38; background: #1a1d24; }
    .trend-card { padding: 12px 24px 8px; }
    .trend-card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
    .trend-card-title { color: #8a8f9a; font-size: 13px; }
    .trend-card-value strong { font-size: 20px; font-weight: 600; color: #ffffff; }
    .trend-card-actions { display: flex; gap: 8px; align-items: center; }
    .trend-card-actions button { padding: 5px 10px; }
    .trend-card-actions .trend-segmented button { padding: 5px 9px; }
    .trend-detail { max-width: 1000px; }
    .trend-detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 8px 16px; }
    .trend-detail .trend-card { padding: 8px 0; }
    .trend-chip strong { color: #ffffff; font-weight: 600; margin-left: 4px; }
  </style>
</head>
