<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'" />
  <title>XIV Fleet Companion</title>
  <link rel="stylesheet" href="../node_modules/uplot/dist/uPlot.min.css" />
  <style>
    body {
      margin: 0;
      font-family: -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    h1 {
      padding: 20px 24px 8px;
      margin: 0;
      font-size: 20px;
    }
    .subtitle {
      padding: 0 24px 16px;
      color: var(--dim);
      font-size: 13px;
    }
    /* The colours that mean something (fine, getting low, well below a warning), and the ones that only say what a
       thing is (gil, a house's address, a Free Company's name). The same as the plugin's (Theme.cs); the warning is
       orange rather than gold so it is never mistaken for gil. */
    :root {
      /* The default look's colours; shared/themes.js sets the chosen look's over these before anything is drawn. */
      --bg: #12141a; --sidebar: #0d0f13; --panel: #1a1d24; --modal: #181b21; --hover: #23262e; --hover-strong: #2f3440;
      --border: #2a2e38; --border-strong: #3a3f4a; --text: #e6e6e6; --text-bright: #ffffff; --text-soft: #c0c4cc;
      --dim: #8a8f9a; --faint: #565b66; --accent: #5b8def; --accent-strong: #3987e5; --link: #7aa7e0; --row-alt: rgba(255, 255, 255, 0.055);
      --heading: #e6e6e6; --glow: none;
      --good: #6fbf82;
      --warn: #e8a04c;
      --danger: #e57373;
      --gil: #f2d06b;
      --address: #8cc4f2;
      --fc: #b8a6f0;
      --fc-points: #5fd3c8;
      --role-tank: #5b8def; --role-tank-base: #a3bff5; --role-healer: #5fb870; --role-healer-base: #a6d9af; --role-dps: #e06464; --role-dps-base: #efa6a6;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    /* A table you can resize keeps each column at the width it is given, rather than stretching them all to fill
       the page: so the last column can be dragged too, the room left over sits after it, and a wider table scrolls. */
    table:has(> thead th.resizable) { width: max-content; }
    /* Cells coloured by meaning or by what they are (tables.jsx: GilText, Pips, toneClass). */
    .tone-good { color: var(--good); }
    .tone-warn { color: var(--warn); }
    .tone-danger { color: var(--danger); }
    .gil { color: var(--gil); }
    .address { color: var(--address); }
    .fc-name { color: var(--fc); }
    .dim { color: var(--dim); }
    .world-after { color: var(--dim); margin-left: 6px; }
    .fc-points { color: var(--fc-points); }
    .rank-bar { display: inline-block; width: 36px; height: 4px; margin-right: 8px; vertical-align: middle; border-radius: 2px; background: var(--border); overflow: hidden; }
    .rank-bar > span { display: block; height: 100%; background: var(--accent); }
    /* A class by its role (tables.jsx roleClass), the same as the plugin's. */
    h1, h2, h3 { color: var(--heading); }
    .look-swatches { display: inline-flex; gap: 3px; margin-left: 10px; vertical-align: middle; }
    .look-swatches > span { width: 14px; height: 14px; border-radius: 3px; border: 1px solid var(--border-strong); }
    .role-tank { color: var(--role-tank); }
    .role-tank-base { color: var(--role-tank-base); }
    .role-healer { color: var(--role-healer); }
    .role-healer-base { color: var(--role-healer-base); }
    .role-dps { color: var(--role-dps); }
    .role-dps-base { color: var(--role-dps-base); }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    .pips { display: inline-flex; gap: 5px; vertical-align: middle; cursor: help; }
    .pip { width: 9px; height: 9px; border-radius: 50%; box-sizing: border-box; }
    .pip.on.good { background: var(--good); }
    .pip.on.warn { background: var(--warn); }
    .pip.off { border: 1.5px solid var(--dim); }
    /* The count behind the dots: not shown, but copied and exported with the table. */
    .pips-count, .copy-only { font-size: 0; }
    th, td {
      text-align: left;
      padding: 8px 24px;
      border-bottom: 1px solid var(--hover);
      font-size: 13px;
    }
    th {
      color: var(--dim);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.04em;
    }
    tr:hover td {
      background: var(--panel);
    }
    .status {
      padding: 24px;
      color: var(--dim);
    }
    .account-group {
      margin-bottom: 8px;
    }
    .account-group h2 {
      padding: 16px 24px 8px;
      margin: 0;
      font-size: 15px;
      border-top: 2px solid var(--border);
    }
    .account-group .count {
      color: var(--dim);
      font-weight: 400;
      font-size: 13px;
    }
    .controls {
      padding: 0 24px 12px;
      font-size: 13px;
      color: var(--text-soft);
    }
    .drag-handle {
      display: inline-block;
      cursor: grab;
      color: var(--faint);
      width: 18px;
      text-align: center;
    }
    tr.sortable-ghost {
      opacity: 0.4;
    }
    .error {
      padding: 24px;
      color: var(--danger);
      white-space: pre-wrap;
    }

    button {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 8px 14px;
      font-size: 13px;
      cursor: pointer;
    }
    button:hover {
      background: var(--hover);
    }
    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    /* Roster's per-row Remove: quiet until hovered; the confirmation wraps inside its cell. */
    /* The start of each roster row: the drag handle and a faint ×, brighter on the row under the mouse. */
    td.row-tools, th.row-tools { width: 48px; min-width: 48px; padding-left: 8px; padding-right: 0; white-space: nowrap; }
    button.remove-character { padding: 0 6px; margin-left: 4px; font-size: 15px; line-height: 18px; color: var(--dim); background: transparent; border-color: transparent; opacity: 0.35; }
    tr:hover button.remove-character, button.remove-character:focus-visible { opacity: 1; }
    button.remove-character:hover { color: var(--danger); border-color: var(--danger); }
    .modal.remove-confirm { max-width: 460px; }
    .modal.remove-confirm p { margin: 0 0 10px; color: var(--text-soft); line-height: 1.5; }
    .modal.remove-confirm button.danger, .modal.backups-confirm button.danger { color: var(--danger); border-color: var(--danger); }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal {
      background: var(--modal);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 24px;
      width: 90%;
      max-width: 800px;
      max-height: 85vh;
      overflow-y: auto;
    }
    .modal h2 {
      margin: 0 0 16px;
      font-size: 17px;
    }
    .modal input[type="text"] {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 6px 10px;
      font-size: 13px;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--hover);
    }
    .warning {
      background: color-mix(in srgb, var(--warn) 10%, transparent);
      border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent);
      color: var(--warn);
      padding: 10px 14px;
      border-radius: 4px;
      font-size: 13px;
      margin-bottom: 12px;
    }
    .preview-table {
      margin-top: 12px;
      font-size: 12px;
    }
    .preview-table th, .preview-table td {
      padding: 6px 10px;
    }
    tr.flagged-row td {
      background: color-mix(in srgb, var(--warn) 8%, transparent);
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding-right: 24px;
    }
    .gear-button {
      font-size: 18px;
      padding: 6px 10px;
      margin-top: 16px;
    }

    .settings-modal {
      max-width: 680px;
      /* A fixed size, so switching tabs does not make the window jump; each tab scrolls inside. */
      height: min(760px, 85vh);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .settings-header {
      display: flex;
      align-items: baseline;
      gap: 12px;
    }
    .settings-header h2 {
      margin-bottom: 12px;
    }
    .settings-tabs {
      display: flex;
      gap: 4px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }
    .settings-tab {
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      border-radius: 0;
      color: var(--dim);
      padding: 8px 14px;
      margin-bottom: -1px;
    }
    .settings-tab:hover {
      color: var(--text);
    }
    .settings-tab.active {
      color: var(--text);
      border-bottom-color: var(--accent);
    }
    .settings-body {
      flex: 1;
      overflow-y: auto;
      padding-right: 6px;
    }
    .settings-section {
      border-top: 1px solid var(--hover);
      padding-top: 16px;
      margin-top: 16px;
    }
    .settings-section:first-of-type {
      border-top: none;
      padding-top: 0;
      margin-top: 0;
    }
    .settings-section h3 {
      margin: 0 0 12px;
      font-size: 14px;
      color: var(--text-soft);
    }
    .settings-row {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 10px;
      font-size: 13px;
    }
    .settings-row label {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .settings-row input[type="text"],
    .settings-row input[type="password"],
    .settings-row input[type="number"] {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 5px 8px;
      font-size: 13px;
    }
    .save-status {
      color: var(--dim);
      font-size: 12px;
    }
    .summary-thresholds {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      color: var(--dim);
      font-size: 13px;
    }
    /* Help text under settings, and an amber attention line */
    .alerts-attention {
      margin: 6px 0 10px;
      color: var(--warn);
      font-size: 13px;
    }
    .alerts-help {
      margin: -4px 0 10px;
      color: var(--dim);
      font-size: 12px;
      line-height: 1.5;
    }
    .plugin-data, .forecast-accuracy {
      cursor: help;
    }
    .plugin-data.stale {
      color: var(--warn);
    }
    /* Database connection: a dot in the header, and a banner while it cannot be reached. */
    .connection-dot {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      cursor: help;
    }
    .connection-dot::before {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--good);
    }
    .connection-dot.offline {
      color: var(--warn);
    }
    .connection-dot.offline::before {
      background: var(--warn);
    }
    .connection-banner {
      margin: 0 0 16px;
      padding: 10px 14px;
      border: 1px solid var(--warn);
      border-radius: 6px;
      color: color-mix(in srgb, var(--warn) 45%, var(--text));
      background: color-mix(in srgb, var(--warn) 8%, transparent);
      font-size: 13px;
      line-height: 1.5;
    }
    .update-banner {
      margin: 0 0 16px;
      padding: 10px 14px;
      border: 1px solid var(--accent);
      border-radius: 6px;
      color: color-mix(in srgb, var(--accent) 35%, var(--text));
      background: color-mix(in srgb, var(--accent) 8%, transparent);
      font-size: 13px;
      line-height: 1.5;
    }
    .update-banner button { margin: 0 4px; }
    .whats-new-head { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .whats-new-head .whats-new-done { margin-left: auto; }
    .whats-new-list { max-height: 260px; overflow-y: auto; margin-top: 6px; }
    .settings-whats-new { max-height: 360px; font-size: 13px; line-height: 1.5; }
    .changelog-version h4 { margin: 10px 0 4px; font-size: 13px; }
    .changelog-date { font-weight: 400; color: var(--dim); }
    .changelog-version p { margin: 4px 0; }
    .changelog-version ul { margin: 4px 0; padding-left: 20px; }
    .changelog-version code { font-size: 12px; }
    /* Settings > Backups */
    .backups-folder, .backups-copy-folder, .backups-pgbin { width: 260px; }
    .backups-keep { width: 60px; }
    .backups-last { margin: 8px 0 12px; font-size: 13px; }
    .backups-list { border-collapse: collapse; margin: 6px 0; font-size: 13px; }
    .backups-list th, .backups-list td { padding: 3px 12px 3px 0; text-align: left; }
    .backups-list td button { margin-right: 6px; }
    .backups-log pre { max-height: 200px; overflow: auto; font-size: 12px; white-space: pre-wrap; }
    .backups-section h4 { margin: 16px 0 4px; }
    /* Settings: Setup Help */
    .setup-pages { display: flex; gap: 6px; margin-bottom: 14px; }
    .setup-page { font-size: 12px; padding: 4px 12px; font-weight: 400; }
    .setup-page.active { background: color-mix(in srgb, var(--accent) 25%, var(--bg)); border-color: color-mix(in srgb, var(--accent) 70%, var(--bg)); color: var(--text); }
    .setup-help { font-size: 13px; line-height: 1.55; color: var(--text-soft); }
    .setup-help p { margin: 0 0 10px; }
    .setup-help h4 { margin: 16px 0 6px; font-size: 13px; color: var(--text); }
    .setup-help ol { padding-left: 22px; margin: 6px 0; }
    .setup-help li { margin-bottom: 6px; }
    .setup-help strong { color: var(--text); }
    .setup-line { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
    .setup-line code { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 4px 8px; user-select: all; word-break: break-all; }
    .setup-copy { font-size: 12px; padding: 3px 10px; font-weight: 400; flex: none; }
    .setup-details, .setup-plugins { border-collapse: collapse; margin: 6px 0 10px; }
    .setup-details th, .setup-plugins th { text-align: left; padding: 4px 16px 4px 0; color: var(--text-soft); font-weight: 600; vertical-align: top; }
    .setup-details td, .setup-plugins td { padding: 4px 16px 4px 0; vertical-align: top; }
    .setup-repo-name { margin-top: 6px; color: var(--text-soft); }
    .credits-list { margin: 4px 0 8px; padding-left: 22px; }
    .speed-findings { margin: 8px 0; padding-left: 22px; }
    .speed-findings li { margin: 3px 0; }
    .speed-findings li.speed-slow { color: var(--warn); }
    .speed-findings li.speed-ok { color: var(--dim); }
    .speed-tabs { border-collapse: collapse; margin-top: 6px; }
    .speed-tabs th, .speed-tabs td { padding: 2px 14px 2px 0; text-align: left; }
    .speed-tabs td:last-child { font-variant-numeric: tabular-nums; }
    .speed-detail { margin: 4px 0 8px; padding-left: 22px; }
    .speed-detail code { font-size: 0.85em; color: var(--dim); }
    .setup-thanks { margin-top: 10px; color: var(--text-soft); }
    .setup-details select { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 4px 6px; }
    .setup-test-address { width: 200px; }
    .setup-test-status { margin: 4px 0 10px; color: var(--text); }
    .setup-open { margin-top: 18px; border-top: 1px solid var(--border); padding-top: 6px; }
    .setup-open-check { margin: 4px 0 8px; color: var(--text); }
    .setup-remove { margin-top: 24px; border-top: 1px solid var(--border); padding-top: 6px; }
    .setup-remove .remove-list, .setup-remove .keep-list { margin: 4px 0 10px; padding-left: 22px; }
    .setup-remove .remove-tailscale { display: block; margin-bottom: 10px; }
    .setup-remove button.danger { background: #8e2b2b; color: #fff; }
    .setup-remove button.danger:disabled { opacity: 0.5; }
    .setup-run { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .modal.setup-wizard { max-width: 680px; font-size: 13px; line-height: 1.55; color: var(--text-soft); }
    .setup-wizard h2 { margin-top: 0; }
    .setup-wizard h4 { margin: 14px 0 4px; color: var(--text); }
    .setup-wizard strong { color: var(--text); }
    .setup-roles { display: flex; flex-direction: column; gap: 8px; margin: 8px 0 12px; }
    .setup-role { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; }
    .setup-role.active { border-color: color-mix(in srgb, var(--accent) 70%, var(--bg)); background: color-mix(in srgb, var(--accent) 12%, var(--bg)); }
    .setup-same-network { display: block; margin: 4px 0 10px; }
    .setup-plan, .setup-steps-list { padding-left: 22px; margin: 6px 0 10px; }
    .setup-steps-list { list-style: none; padding-left: 0; }
    .setup-step { margin-bottom: 6px; }
    .setup-step-mark { display: inline-block; width: 18px; }
    .setup-step.done .setup-step-mark { color: var(--good); }
    .setup-step.failed .setup-step-mark, .setup-problem { color: var(--danger); }
    .setup-step.working .setup-step-mark { color: var(--warn); }
    .setup-names { margin: 10px 0; }
    .setup-ts-status { margin: 8px 0; color: var(--text); }
    /* Supplies */
    .supplies-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 18px; }
    .supplies-summary { display: flex; flex-wrap: wrap; gap: 12px; padding: 0 24px 12px; }
    .supply-card { flex: 1 1 0; min-width: 200px; box-sizing: border-box; padding: 14px 16px; }
    .supply-card-label { color: var(--dim); font-size: 13px; }
    .supply-card-value { font-size: 17px; font-weight: 600; margin-top: 4px; }
    .supply-card-note { color: var(--dim); font-size: 12px; margin-top: 4px; }
    .not-synced-tag { white-space: nowrap; margin-left: 8px; padding: 1px 6px; border-radius: 3px; font-size: 11px; color: var(--warn); border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); cursor: help; }
    .not-synced-note { margin: 12px 24px; }
    .unseen-retainers { margin: 8px 24px 12px; }
    .unseen-retainers summary { cursor: pointer; }
    .unseen-retainers ul { margin: 8px 0 4px; padding-left: 20px; max-height: 200px; overflow-y: auto; }
    .unseen-retainers-note { color: var(--dim); font-size: 12px; }
    .supplies-note { color: var(--dim); font-size: 12px; padding: 0 24px 8px; }
    .note-warn { color: var(--warn); font-weight: 600; }
    .supplies-note-inline { color: var(--dim); font-size: 12px; }
    .fc-credits { margin-top: 16px; }
    .fc-credits table { margin-bottom: 12px; }
    .pcs-check { margin: 12px 24px; padding: 8px 12px; }
    .pcs-check summary { cursor: pointer; }
    .pcs-check pre { white-space: pre-wrap; font-size: 12px; margin: 8px 0 0; }
    .pcs-problems ul { margin: 4px 0; padding-left: 18px; }
    .pcs-problems summary { cursor: pointer; }
    .pcs-unreported { margin: 12px 24px; }
    .table-menu { position: fixed; z-index: 1000; background: var(--hover); border: 1px solid var(--border-strong); border-radius: 6px; padding: 4px; display: flex; flex-direction: column; box-shadow: 0 4px 16px rgba(0,0,0,0.4); }
    .table-menu button { text-align: left; background: none; border: none; color: inherit; padding: 6px 12px; cursor: pointer; }
    .table-menu button:hover { background: var(--hover-strong); }
    .table-menu-note { position: fixed; bottom: 16px; right: 16px; z-index: 1000; background: var(--hover); border: 1px solid var(--border-strong); border-radius: 6px; padding: 8px 12px; font-size: 13px; }
    .supplies > .status { padding: 0 24px; }
    .supplies-table th.supply-group { text-align: center; border-bottom: 1px solid var(--border); }
    .supplies-table td:first-child, .supplies-table td:nth-child(2) { white-space: nowrap; }
    .supplies-table td.supply-warn { color: var(--warn); }
    .supplies-table td.supply-danger { color: var(--danger); font-weight: 600; }
    .pcs-table td.supply-warn { color: var(--warn); }
    .pcs-table td.supply-danger { color: var(--danger); font-weight: 600; }
    .pcs-update-plugin { margin: 8px 0 12px; padding: 10px 14px; border: 1px solid var(--danger); border-radius: 6px; color: color-mix(in srgb, var(--danger) 45%, var(--text)); background: color-mix(in srgb, var(--danger) 8%, transparent); font-size: 13px; line-height: 1.5; }
    .shared-sync { margin: 12px 24px; }
    .pcs .shared-sync { margin: 8px 0 12px; }
    .shared-sync ul { margin: 6px 0; padding-left: 20px; }
    .shared-sync details { margin: 4px 0; }
    .shared-sync summary { cursor: pointer; }

    .subs-dim { color: var(--dim); }

    /* Income */
    .income-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 18px; }
    .income > .status { padding: 0 24px; }
    .income-table td { white-space: nowrap; }
    .income-table td.income-real { font-weight: 600; }
    .income-table td.income-none { color: var(--dim); }
    .income-table td.income-warn { color: var(--warn); }
    .income-table td.income-danger { color: var(--danger); font-weight: 600; }
    .error-inline { color: var(--danger); font-size: 12px; }
    /* Inventory → Where Is It? */
    .where-note { color: var(--dim); font-size: 12px; padding: 0 24px 8px; }
    .where-item { margin: 10px 0 20px; }
    .where-item h3 { margin: 0 0 6px; padding: 0 24px; font-size: 15px; color: var(--text); }
    .where-total { margin-left: 8px; color: var(--dim); font-size: 13px; font-weight: normal; }
    .where-is-it > .status, .where-is-it > .error { padding-left: 24px; padding-right: 24px; }
    .status-inline { color: var(--dim); font-size: 12px; }
    .where-item tr.where-account td { padding-top: 12px; font-weight: 600; color: var(--text-soft); font-size: 13px; }
    /* Parts → Shopping List */
    .shopping-section { margin: 14px 0 22px; }
    .shopping-section h3 { margin: 0 0 6px; padding: 0 24px; font-size: 15px; color: var(--text); }
    .shopping-note { color: var(--dim); font-size: 12px; margin: 2px 0 6px; padding: 0 24px; }
    .shopping-list > .error, .shopping-section > .status { padding-left: 24px; padding-right: 24px; }
    .shopping-section td .shopping-note { padding: 0; }
    .shopping-section tr.shopping-done td { color: var(--dim); }
    .shopping-places { color: var(--text-soft); font-size: 12px; }
    .shopping-total { margin-left: 10px; color: var(--gil); font-size: 14px; }
    .shopping-note.shopping-too-few { color: var(--warn); }
    button.link-button { padding: 0; background: transparent; border: none; color: var(--link); cursor: pointer; font-size: 12px; text-decoration: underline; }
    /* How long since an FC house was last entered (Free Companies tab and Summary): green while recent. */
    .house-age { color: var(--good); }
    .house-age.warn {
      color: var(--warn);
    }
    .house-age.danger,
    .house-age.unknown {
      color: var(--danger);
      font-weight: 600;
    }

    .app-shell {
      display: flex;
      height: 100vh;
    }
    .sidebar {
      width: 180px;
      flex-shrink: 0;
      background: var(--sidebar);
      border-right: 1px solid var(--hover);
      padding: 16px 0;
      overflow-y: auto;
    }
    .sidebar-button {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      border-radius: 0;
      border-left: 3px solid transparent;
      padding: 10px 20px;
      font-size: 13px;
      color: var(--text-soft);
    }
    .sidebar-button:hover {
      background: var(--panel);
    }
    .sidebar-group + .sidebar-group { margin-top: 10px; }
    .sidebar-group-title { padding: 6px 20px 4px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--dim); }
    .sidebar-button.active {
      background: var(--panel);
      box-shadow: var(--glow);
      border-left-color: var(--accent);
      color: var(--text);
    }
    .coming-soon-tag {
      font-size: 10px;
      color: var(--faint);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-top: 2px;
    }
    .column-chooser-wrap { position: relative; display: inline-block; }
    .column-chooser {
      position: absolute; z-index: 30; top: 100%; left: 0; margin-top: 4px; min-width: 300px; max-height: 80vh; overflow-y: auto;
      background: var(--panel); border: 1px solid var(--border-strong); border-radius: 6px; padding: 10px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
    }
    .column-chooser-title { font-weight: 600; color: var(--text-soft); margin: 2px 0 4px; }
    .column-chooser-group { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; margin: 8px 0 2px; }
    .column-chooser-add { max-height: 260px; overflow-y: auto; }
    .column-chooser-search { width: 100%; box-sizing: border-box; margin: 2px 0 6px; }
    .column-chooser-row { display: flex; justify-content: space-between; align-items: center; padding: 2px 0; }
    .column-chooser-row button { padding: 0 6px; margin-left: 2px; }
    .main-pane {
      flex: 1;
      overflow-y: auto;
      overflow-x: auto;
      min-width: 0;
    }

    /* ---- Trends ---- */
    .trend-field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--dim); }
    .trend-field select, .trend-field input { min-width: 180px; }
    .trend-segmented { display: inline-flex; }
    .trend-segmented button { border-radius: 0; margin-left: -1px; padding: 7px 12px; }
    .trend-segmented button:first-child { border-radius: 4px 0 0 4px; margin-left: 0; }
    .trend-segmented button:last-child { border-radius: 0 4px 4px 0; }
    .trend-segmented button.active { background: color-mix(in srgb, var(--accent) 25%, var(--bg)); border-color: var(--accent-strong); color: var(--text-bright); position: relative; }
    .trend-chart-wrap { position: relative; margin-top: 8px; transition: opacity 0.15s; }
    .trend-tip {
      position: absolute; z-index: 5; pointer-events: none; min-width: 190px;
      background: var(--panel); border: 1px solid var(--border); border-radius: 4px; padding: 8px 10px; font-size: 12px;
    }
    .trend-tip-time { color: var(--dim); margin-bottom: 6px; }
    .trend-tip-row { display: flex; align-items: center; gap: 8px; margin-top: 3px; }
    .trend-tip-row strong { color: var(--text-bright); font-size: 13px; }
    .trend-tip-name { color: var(--dim); }
    .trend-key { display: inline-block; width: 14px; height: 3px; border-radius: 2px; flex-shrink: 0; }
    .trend-chip {
      display: inline-flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--border);
      border-radius: 4px; padding: 3px 8px; font-size: 12px;
    }
    .trend-menu {
      position: absolute; top: 100%; left: 0; z-index: 10; background: var(--panel); border: 1px solid var(--border-strong);
      max-height: 240px; overflow-y: auto; min-width: 340px;
    }
    .trend-menu-item { padding: 5px 10px; cursor: pointer; font-size: 13px; }
    .trend-menu-item:hover { background: var(--hover); }
    .trend-legend { display: flex; flex-wrap: wrap; gap: 6px 22px; margin: 6px 0 4px; font-size: 13px; }
    .trend-legend-item { display: inline-flex; align-items: center; gap: 8px; color: var(--dim); }
    .trend-legend-item strong { color: var(--text); font-weight: 600; }
    .trend-summary { display: flex; gap: 40px; margin: 4px 0 6px; }
    table.trend-stats { margin-top: 12px; width: auto; }
    table.trend-stats td, table.trend-stats th { padding: 4px 14px 4px 0; text-align: right; white-space: nowrap; }
    table.trend-stats td:first-child, table.trend-stats th:first-child { text-align: left; }
    .trend-summary-label { color: var(--dim); font-size: 12px; }
    .trend-summary-value { font-size: 26px; font-weight: 600; color: var(--text-bright); }
    .trend-summary-value.gil, .trend-card-value strong.gil, .supply-card-value.gil { color: var(--gil); }
    .trend-summary-sub { font-size: 14px; font-weight: 400; color: var(--dim); }
    .trend-summary-sub.tone-good { color: var(--good); }
    .trend-summary-sub.tone-warn { color: var(--warn); }
    .u-select { background: color-mix(in srgb, var(--accent-strong) 18%, transparent); }
    .trend-table-box { box-sizing: border-box; overflow: auto; resize: vertical; min-height: 160px; border: 1px solid var(--hover); border-radius: 4px; }
    .trend-table-box table { margin: 0; }
    .trend-table-box th { position: sticky; top: 0; z-index: 1; background: var(--bg); }
    .trend-note { color: var(--dim); font-size: 13px; padding: 4px 0; }
    .trends-root select, .trends-root input[type="text"] {
      background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 4px;
      padding: 7px 8px; font-size: 13px;
    }
    .trends-root select:focus, .trends-root input[type="text"]:focus { outline: 1px solid var(--accent-strong); }
    .trend-link {
      background: none; border: 1px solid transparent; color: var(--dim); padding: 1px 4px; margin-left: 6px;
      border-radius: 3px; vertical-align: middle; line-height: 0; cursor: pointer;
    }
    .trend-link:hover { color: var(--accent-strong); border-color: var(--border); background: var(--panel); }
    .trend-card { padding: 12px 24px 8px; }
    .trend-card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
    .trend-card-title { color: var(--dim); font-size: 13px; }
    .trend-card-value strong { font-size: 20px; font-weight: 600; color: var(--text-bright); }
    .trend-card-actions { display: flex; gap: 8px; align-items: center; }
    .trend-card-actions button { padding: 5px 10px; }
    .trend-card-actions .trend-segmented button { padding: 5px 9px; }
    .trend-detail { max-width: 1000px; }
    .trend-detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 8px 16px; }
    .trend-detail .trend-card { padding: 8px 0; }
    .trend-chip strong { color: var(--text-bright); font-weight: 600; margin-left: 4px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="../node_modules/react/umd/react.production.min.js"></script>
  <script src="../node_modules/react-dom/umd/react-dom.production.min.js"></script>
  <script src="../node_modules/sortablejs/Sortable.min.js"></script>
  <script src="../node_modules/uplot/dist/uPlot.iife.min.js"></script>
  <!-- The window's code, one file per tab plus the shared table pieces. They share one scope, so
       tables.js goes first and app.js (which starts the app) goes last. -->
  <script src="../shared/themes.js"></script>
  <script src="tables.js"></script>
  <script src="roster.js"></script>
  <script src="backups.js"></script>
  <script src="setup-help.js"></script>
  <script src="setup-wizard.js"></script>
  <script src="settings.js"></script>
  <script src="subs.js"></script>
  <script src="supplies.js"></script>
  <script src="income.js"></script>
  <script src="parts.js"></script>
  <script src="shopping.js"></script>
  <script src="retainers.js"></script>
  <script src="salvage.js"></script>
  <script src="fc-directory.js"></script>
  <script src="routes.js"></script>
  <script src="summary.js"></script>
  <script src="inventory.js"></script>
  <script src="trends.js"></script>
  <script src="market.js"></script>
  <script src="pcs.js"></script>
  <script src="app.js"></script>
</body>
</html>
