name: Release

# When a change lands on main with a version that has no release yet, create the tag and
# the GitHub release (description taken from CHANGELOG.md), then build the Windows installer and
# publish it to the public CrownedPandaXIV/XIVFleetCompanion-Releases repository, where installed
# copies of the app look for updates. Does nothing for a version already published.
#
# Publishing needs the RELEASES_TOKEN secret (Settings → Secrets and variables → Actions): a
# fine-grained token allowed only "Contents: read and write" on XIVFleetCompanion-Releases. Without
# it the installer is not published (the step says so) and nothing fails.
on:
  push:
    branches: [ main ]

permissions:
  contents: write

# One publishing run at a time (this and test-release.yml both change the Releases repo's "testing" release): a
# second waits, never cancels.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  tag-release:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Tag and release a new version
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        version=$(node -p "require('./package.json').version")
        echo "Version: $version"
        bash .github/scripts/tag-release.sh "$version" "$GITHUB_SHA"

  installer:
    needs: tag-release
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        persist-credentials: false

    - name: Already published?
      id: check
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
      run: |
        version=$(node -p "require('./package.json').version")
        if [ -z "$GH_TOKEN" ]; then
          echo "No RELEASES_TOKEN secret yet: the installer for ${version} is not published."
          echo "publish=false" >> "$GITHUB_OUTPUT"
        elif [ "$(bash .github/scripts/published.sh "$version")" = yes ]; then
          echo "v${version} is already published."
          echo "publish=false" >> "$GITHUB_OUTPUT"
        else
          echo "publish=true" >> "$GITHUB_OUTPUT"
        fi

    - uses: actions/setup-node@v5
      if: steps.check.outputs.publish == 'true'
      with:
        node-version: 22
        cache: npm

    # No token here: installing and building run other people's code (every package's install scripts), which must not
    # reach the one that publishes updates.
    - name: Build the installer
      if: steps.check.outputs.publish == 'true'
      shell: bash
      run: |
        npm ci
        npm run dist

    - name: Publish the installer
      if: steps.check.outputs.publish == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
      run: |
        version=$(node -p "require('./package.json').version")
        bash .github/scripts/publish-installer.sh "$version"
        # Copies with "Get test versions" on look at the testing release: it gets this version too when it's newer.
        bash .github/scripts/publish-testing.sh "$version" --if-newer
