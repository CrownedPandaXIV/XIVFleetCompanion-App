name: Measure
on: pull_request
jobs:
  zip:
    runs-on: windows-2022
    strategy:
      matrix:
        major: [14, 15, 16, 17]
    steps:
    - shell: pwsh
      run: |
        $ProgressPreference = 'SilentlyContinue'
        $major = ${{ matrix.major }}
        $found = $null
        foreach ($minor in 30..0) {
          foreach ($b in 6..1) {
            $u = "https://get.enterprisedb.com/postgresql/postgresql-$major.$minor-$b-windows-x64-binaries.zip"
            try { $r = Invoke-WebRequest -Uri $u -Method Head; $found = $u; break } catch { }
          }
          if ($found) { break }
        }
        if (-not $found) { throw "none for $major" }
        Invoke-WebRequest -Uri $found -OutFile z.zip
        Write-Output "URL $found"
        Write-Output ("SIZE " + (Get-Item z.zip).Length)
        Write-Output ("SHA " + (Get-FileHash z.zip -Algorithm SHA256).Hash)
        Add-Type -AssemblyName System.IO.Compression.FileSystem
        $zip = [IO.Compression.ZipFile]::OpenRead("$PWD\z.zip")
        $zip.Entries | Where-Object { $_.FullName -match '^pgsql/bin/[^/]+\.dll$' -or $_.FullName -match 'pg_(dump|restore)\.exe$' -or $_.FullName -match '^pgsql/[^/]+\.txt$' } | ForEach-Object { "FILE $($_.FullName) $($_.Length)" }
        $zip.Dispose()
        Expand-Archive z.zip -DestinationPath x
        $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
        $db = (Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1).FullName
        # Every DLL pg_dump and pg_restore load from the bin folder, following each one's own imports.
        $todo = [System.Collections.Generic.Queue[string]]::new(); $seen = @{}
        'pg_dump.exe','pg_restore.exe' | ForEach-Object { $todo.Enqueue($_) }
        while ($todo.Count) {
          $f = $todo.Dequeue(); if ($seen[$f]) { continue }; $seen[$f] = $true
          & $db /dependents "x/pgsql/bin/$f" | ForEach-Object { $_.Trim() } | Where-Object { $_ -match '\.dll$' -and (Test-Path "x/pgsql/bin/$_") } | ForEach-Object { $todo.Enqueue($_) }
        }
        Write-Output ("NEEDS " + (($seen.Keys | Sort-Object) -join ' '))
        & x/pgsql/bin/pg_dump.exe --version
