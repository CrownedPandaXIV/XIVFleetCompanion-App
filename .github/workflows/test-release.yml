name: Test release

# A test version of the app, for trying before everyone gets it: pushing to the testing branch builds the
# installer as "<version>-test.<run number>" (package.json's version, so 1.6.0-test.12 for 1.6.0) and puts it on
# the "testing" pre-release of CrownedPandaXIV/XIVFleetCompanion-Releases. Only copies of the app with Settings →
# General → Updates → Get test versions on look there (update-feed.js). Normal releases (release.yml) are unchanged,
# and also go to the testing release when they're newer, so testers get every normal update too.
#
# Needs the RELEASES_TOKEN secret, as release.yml does. Without it nothing is published (the step says so).
on:
  push:
    branches: [ testing ]

permissions:
  contents: read

# One publishing run at a time (this and release.yml both change the Releases repo's "testing" release): a second
# waits, never cancels.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        persist-credentials: false

    - uses: actions/setup-node@v5
      with:
        node-version: 22
        cache: npm

    # No token here: installing and building run other people's code (every package's install scripts), which must not
    # reach the one that publishes updates.
    - name: Build the test version
      id: build
      shell: bash
      run: |
        base=$(node -p "require('./package.json').version")
        version="${base}-test.${GITHUB_RUN_NUMBER}"
        echo "Test version: ${version}"
        echo "version=${version}" >> "$GITHUB_OUTPUT"
        npm ci
        npm version "$version" --no-git-tag-version
        npm run dist

    - name: Publish the test version
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
      run: |
        if [ -z "$GH_TOKEN" ]; then echo "No RELEASES_TOKEN secret: the test version is not published."; exit 0; fi
        bash .github/scripts/publish-testing.sh "${{ steps.build.outputs.version }}"
